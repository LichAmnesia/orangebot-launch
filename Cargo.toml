[workspace]
resolver = "3"
members = ["crates/*", "apps/ob-cli", "apps/ob-asr-server", "apps/ui", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
httpmock = "0.7"
tempfile = "3"
futures-util = "0.3"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
clap = { version = "4.6", features = ["derive", "env"] }
axum = { version = "0.8", features = ["multipart"] }
whisper-rs = { version = "0.16", features = ["metal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hound = "3.5"
flate2 = "1"
tar = "0.4"
cpal = "0.15"
arboard = { version = "3.6", default-features = false }
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSArray"] }

ob-domain = { path = "crates/ob-domain" }
ob-models = { path = "crates/ob-models" }
ob-providers = { path = "crates/ob-providers" }
ob-runtime = { path = "crates/ob-runtime" }
ob-tools = { path = "crates/ob-tools" }
ob-storage = { path = "crates/ob-storage" }
ob-audio = { path = "crates/ob-audio" }
ob-platform = { path = "crates/ob-platform" }
ob-platform-macos = { path = "crates/ob-platform-macos" }
ob-type = { path = "crates/ob-type" }
ob-meeting = { path = "crates/ob-meeting" }
ob-ipc = { path = "crates/ob-ipc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
