[package]
name = "ob-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "launch"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
ob-domain = { workspace = true }
ob-ipc = { workspace = true }
ob-models = { workspace = true }
ob-storage = { workspace = true }
ob-tools = { workspace = true }
ob-type = { workspace = true }
ob-meeting = { workspace = true }
ob-providers = { workspace = true }
keyring = { workspace = true }
reqwest = { workspace = true }
ob-audio = { workspace = true }
ob-platform = { workspace = true }
ob-runtime = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ob-platform-macos = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
